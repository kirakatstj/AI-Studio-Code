name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'adopt'
          java-version: '11'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Init Cordova Project
        run: |
          cordova create project com.aistudio.code AIStudioCode
          cd project
          cordova platform add android

      - name: Copy Web Files
        run: |
          rm -rf project/www/*
          cp index.html project/www/
          if [ -f "manifest.json" ]; then cp manifest.json project/www/; fi
          if [ -d ".well-known" ]; then cp -r .well-known project/www/; fi

      - name: Build APK
        run: |
          cd project
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/platforms/android/app/build/outputs/apk/debug/app-debug.apk
