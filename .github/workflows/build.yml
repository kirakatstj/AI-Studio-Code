name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Cordova globally
        run: npm install -g cordova

      - name: Create Cordova project structure
        run: |
          cordova create myApp com.kirakatstj.aistudiocode AIStudioCode
          cd myApp
          # Копируем твои файлы в папку www для сборки
          rm -rf www/*
          cp -r ../index.html ../manifest.json ../icon.png ../.well-known www/ || cp ../index.html www/
          cordova platform add android

      - name: Build Debug APK
        run: |
          cd myApp
          cordova build android --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk

